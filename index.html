<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Hazard Reporting Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #561212;
            color: white;
            text-align: center;
            padding: 15px;
        }

        main {
            margin: 30px;
        }

        table {
            width: 100%;
            background-color: white;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ccc;
            text-align: left;
        }

        th {
            background-color: #ddd;
        }
    </style>
</head>

<body>

    <header>
        <h1>Road Hazard Reporting Portal</h1>
        <p>Road Complaints and Repair Status</p>
    </header>

    <main>
        <h2>Reported Road Hazards</h2>

        <table>
            <thead>
                <tr>
                    <th>Complaint ID</th>
                    <th>Category</th>
                    <th>Location</th>
                    <th>Report Date</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="complaints"></tbody>
        </table>
    </main>

    <script>
        const complaints = [
            ["RH001", "Pothole", "Lucknow Chowk, Main Road", "10-10-2026", "Pending"],
            ["RH002", "Damaged Streetlight", "Alambagh Chauraha", "05-11-2026", "In Progress"],
            ["RH003", "Waterlogging", "Vasant Kunj, Sarojini Nagar", "10-12-2026", "Resolved"],
            ["RH004", "Pothole", "Ameenabad", "03-09-2026", "In Progress"],
            ["RH005", "Damaged Streetlight", "Hydle Colony", "22-10-2026", "Pending"]
        ];

        const table = document.getElementById("complaints");

        complaints.forEach(function(c) {
            table.innerHTML += `
                <tr>
                    <td>${c[0]}</td>
                    <td>${c[1]}</td>
                    <td>${c[2]}</td>
                    <td>${c[3]}</td>
                    <td>${c[4]}</td>
                </tr>
            `;
        });
    </script>

</body>
</html>
