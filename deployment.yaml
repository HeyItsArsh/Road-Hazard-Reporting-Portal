apiVersion: apps/v1
kind: Deployment
metadata:
  name: road-hazard-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: road-hazard-portal
  template:
    metadata:
      labels:
        app: road-hazard-portal
    spec:
      containers:
        - name: road-hazard-portal
          image: HeyItsArsh/road-hazard-portal:stable
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: road-hazard-service
spec:
  type: NodePort
  selector:
    app: road-hazard-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 31150
